<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Remove all margins, fill the screen, paint it pure black */
  html, body {
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Make the video fill the entire container */
  video {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Ensures the video respects aspect ratio without cropping */
    background: #000;
    outline: none;
    border: none;
  }
  
  /* Minimal standby text */
  #placeholder {
    color: #444;
    font-family: sans-serif;
    font-size: 24px;
    position: absolute;
  }
</style>
</head>
<body>

<div id="placeholder">Waiting for video...</div>
<video id="tvPlayer" playsinline style="display: none;"></video>

<script>
  const player = document.getElementById('tvPlayer');
  const placeholder = document.getElementById('placeholder');

  function playVideo(uriString) {
    placeholder.style.display = 'none';
    player.style.display = 'block';
    
    player.src = uriString;
    player.play().catch(err => {
        console.error("Autoplay failed:", err);
    });
  }

  function stopVideo() {
    player.pause();
    player.src = "";
    player.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.innerText = 'Video Stopped';
  }
  
  player.onended = function() {
    player.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.innerText = 'Playback Finished';
  };
</script>
</body>
</html>
