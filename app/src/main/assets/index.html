<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; /* Black background for video */
    overflow: hidden;
    font-family: sans-serif;
  }
  .window {
    position: absolute;
    top: 6%; left: 6%; right: 6%; bottom: 6%;
    background: #000;
    border: 2px solid #ffffff;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: bold;
  }
  .menubar {
    background: #c0c0c0;
    padding: 4px 8px;
    font-size: 14px;
    border-bottom: 1px solid #808080;
  }
  
  /* Video Player Container */
  .player-container {
    flex: 1;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  
  /* Placeholder text */
  .placeholder {
    color: white;
    text-align: center;
  }

  .statusbar {
    background: #c0c0c0;
    border-top: 1px solid #808080;
    padding: 4px 10px;
    font-size: 12px;
    color: #333;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">Local PC -- Video Player</div>
    <div class="menubar">File&nbsp;&nbsp;&nbsp;Video&nbsp;&nbsp;&nbsp;View</div>
    
    <div class="player-container">
        <div id="placeholderText" class="placeholder">
            Select a video on the phone to play.<br>
            Tap to Full Screen.
        </div>
        <video id="tvPlayer" playsinline onended="resetPlayer()">
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="statusbar" id="statusBar">Ready</div>
  </div>

<script>
  const player = document.getElementById('tvPlayer');
  const status = document.getElementById('statusBar');
  const placeholder = document.getElementById('placeholderText');

  // Update content when phone sends text (for compatibility)
  function setContent(text) {
    if (text.length > 50) {
        // If content looks like a filename, show it in status
        status.innerText = "Playing: " + text.substring(0, 30) + "...";
        placeholder.style.display = 'none';
        player.style.display = 'block';
    } else {
        status.innerText = text;
        player.pause();
        placeholder.style.display = 'block';
        player.style.display = 'none';
    }
  }

  // Called from Kotlin when a video URI is selected
  function playVideo(uriString) {
    console.log("Playing URI: " + uriString);
    status.innerText = "Loading...";
    placeholder.style.display = 'none';
    player.style.display = 'block';
    
    player.src = uriString;
    player.play().catch(err => {
        console.error("Auto-play blocked", err);
        status.innerText = "Error loading video. Tap to start.";
    });
    
    // Ensure full screen on TV (Android 4.4+)
    player.addEventListener('click', () => {
        if (player.requestFullscreen) {
            player.requestFullscreen().catch(err => console.error(err));
        }
    });
  }

  // Stop video
  function stopVideo() {
    player.pause();
    player.src = "";
    status.innerText = "Stopped";
    placeholder.style.display = 'block';
    player.style.display = 'none';
  }

  function resetPlayer() {
    status.innerText = "Playback finished.";
    // Optional: remove src to clear buffer
    // player.src = "";
  }
</script>
</body>
</html>
