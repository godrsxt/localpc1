<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  video {
    width: 100%; height: 100%; object-fit: contain;
    background: #000; outline: none; border: none;
  }
  #placeholder {
    color: #444; font-family: sans-serif; font-size: 24px; position: absolute; text-align: center;
  }
</style>
</head>
<body>

<div id="placeholder">Cast Connected<br><span style="font-size: 16px;">Waiting for video from Library...</span></div>
<video id="tvPlayer" playsinline style="display: none;"></video>

<script>
  const player = document.getElementById('tvPlayer');
  const placeholder = document.getElementById('placeholder');

  // --- Send Information continuously back to Kotlin Bridge ---
  function syncState() {
      if (window.AndroidBridge) {
          const duration = isNaN(player.duration) ? 0 : player.duration;
          window.AndroidBridge.updateState(!player.paused, player.currentTime, duration);
      }
  }
  setInterval(syncState, 500); // Guarantees smooth sync without crashing WebView event listeners
  
  player.addEventListener('ended', function() {
      if(window.AndroidBridge) window.AndroidBridge.onEnded();
      player.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.innerHTML = "Playback Finished";
  });

  // --- Receive Commands from Kotlin ---
  function playVideo(uriString) {
    placeholder.style.display = 'none';
    player.style.display = 'block';
    
    player.src = uriString;
    player.play().catch(err => console.error("Autoplay failed:", err));
  }

  function pauseVideo() { player.pause(); }
  function resumeVideo() { player.play(); }
  function seekVideo(seconds) { player.currentTime = seconds; }
  function setVolume(level) { player.volume = level; }
</script>
</body>
</html>
