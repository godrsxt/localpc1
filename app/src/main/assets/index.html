<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #008080; /* classic desktop teal */
    font-family: sans-serif;
    overflow: hidden;
  }
  .window {
    position: absolute;
    top: 6%; left: 6%; right: 6%; bottom: 6%;
    background: #c0c0c0;
    border: 2px solid #ffffff;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: bold;
  }
  .menubar {
    background: #c0c0c0;
    padding: 4px 8px;
    font-size: 14px;
    border-bottom: 1px solid #808080;
  }
  textarea {
    flex: 1;
    border: none;
    resize: none;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    background: white;
    outline: none;
  }
  .statusbar {
    background: #c0c0c0;
    border-top: 1px solid #808080;
    padding: 4px 10px;
    font-size: 12px;
    color: #333;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">Notepad -- controlled from phone</div>
    <div class="menubar">File&nbsp;&nbsp;&nbsp;Edit&nbsp;&nbsp;&nbsp;View</div>
    <textarea id="notepadArea" readonly placeholder="Type on your phone -- it appears here live."></textarea>
    <div class="statusbar">Local PC v0.1 -- Notepad</div>
  </div>

<script>
  function setContent(text) {
    document.getElementById('notepadArea').value = text;
  }
</script>
</body>
</html>
